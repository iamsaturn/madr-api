services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:app_password@db:5432/app_db
      SECRET_KEY: local-development-secret-key-change-me
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRES: 60

volumes:
  postgres_data: